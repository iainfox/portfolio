<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iain Fox - Portfolio</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
</head>
<body>
    <main class="main-container">
        <section class="profile-container" aria-label="Profile">
            <div class="details-container">
                <img class="pfp" src="assets/pfp.png" alt="Selfie of me">
                <div>
                    <h1 class="name">Iain Fox</h1>
                    <address style="display: flex;">
                        <img src="assets/map-pin.svg" class="icon" style="filter: invert(80%);" alt="Map pin icon">
                        <span class="info">Houston, Texas</span>
                    </address>
                </div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
